<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSSC 3 – User Portal</title>

  <!-- Progressive Web App (PWA) Tags -->
  <link rel="manifest" href="/manifest.json?v=3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/logo.png?v=3">
  <meta name="theme-color" content="#023047">

  <!-- Optimized Font Stack: Game + Modern Geometric -->
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>

    /* ─── CORE RESET & MONOCRAFT AESTHETICS ─── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --mc-sky:       #007cff;
      --mc-sky-light: #4da2ff;
      --mc-sky-deep:  #0057c8;
      --mc-grass:     #5c8e32;
      --mc-grass-d:   #436824;
      --mc-dirt:      #3b2716;
      --mc-dirt-light:#573a21;
      --mc-yellow:    #ffcc00;
      --mc-blue-dark: #023047;
      --mc-stone:     #777777;
      --voxel-dark:   #1c1d24;
      --voxel-gray:   #e9edf3;
      --panel-white:  #fffaf0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Nunito", sans-serif;
      font-size: 1.15rem;
      background-color: #2b2b2b;
      /* Repeating blocky dark background */
      background-image: 
        linear-gradient(rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.35) 100%),
        repeating-linear-gradient(45deg, #1b1b1b 0px, #1b1b1b 2px, #252525 2px, #252525 12px);
      color: #ffffff;
      overflow-x: hidden;
      font-weight: 600;
      line-height: 1.5;
    }

    img {
      display: block;
      max-width: 100%;
      image-rendering: auto;
    }

    a, button, input, textarea {
      font: inherit;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 4px solid #55ffff;
      outline-offset: 4px;
    }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar {
      width: 16px;
      background: #111111;
    }
    ::-webkit-scrollbar-thumb {
      background: #8b8b8b;
      border: 4px solid #111111;
      box-shadow: inset -2px -2px 0px #555555, inset 2px 2px 0px #ffffff;
    }

    /* ─── NAVIGATION BAR (HOTBAR STYLE) ─── */
    nav {
      background: rgba(30, 30, 35, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 4px solid #000000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      padding: 12px max(24px, calc((100vw - 1180px) / 2));
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      gap: 18px;
    }
    .nav-brand-text {
      font-family: "Press Start 2P", monospace;
      font-size: 11px;
      color: var(--mc-yellow);
      text-shadow: 2px 2px 0px #000000;
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .nav-brand-text span {
      color: #55ffff;
      font-size: 8px;
      display: block;
      margin-top: 0;
      font-family: "Press Start 2P", monospace;
      font-weight: normal;
    }
    .nav-links {
      display: flex;
      gap: 10px;
      list-style: none;
    }
    .nav-links a {
      font-family: "Press Start 2P", monospace;
      font-size: 9px;
      color: var(--voxel-dark);
      text-decoration: none;
      border: 3px solid var(--voxel-dark);
      padding: 8px 16px;
      border-radius: 0;
      background: #ffffff;
      box-shadow: 2px 2px 0px var(--voxel-dark);
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }
    .nav-links a:hover {
      background: var(--mc-yellow);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--voxel-dark);
    }

    /* Head Bar Integrated Logos Hotbar */
    .nav-logos-hotbar {
      display: flex;
      gap: 6px;
      background: #8f8f8f;
      border: 3.5px solid #000000;
      padding: 3px;
      box-shadow: inset -2.5px -2.5px 0 #4a4a4a, inset 2.5px 2.5px 0 #dbdbdb;
      border-radius: 0;
    }
    .nav-logo-slot {
      width: 44px;
      height: 44px;
      background: #8b8b8b;
      border: 3px solid #373737;
      box-shadow: inset -3px -3px 0 #555555, inset 3px 3px 0 #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .nav-logo-slot img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.15));
    }

    /* ─── 3D OUTLINED GEOMETRIC TYPOGRAPHY ─── */
    .voxel-title-white {
      font-family: "Fredoka", sans-serif;
      font-weight: 800;
      font-size: 3.65rem;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 0;
      -webkit-text-stroke: 2px #000000;
      text-shadow: 
        -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
        1px 2px 0px #bbbbbb, 2px 3px 0px #bbbbbb, 3px 4px 0px #999999, 4px 5px 0px #999999,
        5px 6px 0px #000000, 6px 7px 0px #000000, 7px 8px 10px rgba(0,0,0,0.5);
    }
    .voxel-title-gold {
      font-family: "Fredoka", sans-serif;
      font-weight: 800;
      font-size: 3.65rem;
      color: var(--mc-yellow);
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 0;
      -webkit-text-stroke: 2px #000000;
      text-shadow: 
        -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
        1px 2px 0px #ffa000, 2px 3px 0px #ffa000, 3px 4px 0px #d84315, 4px 5px 0px #d84315,
        5px 6px 0px #000000, 6px 7px 0px #000000, 7px 8px 10px rgba(0,0,0,0.5);
    }

    /* ─── DATES BLUE BANNER ─── */
    .voxel-banner-blue {
      background: var(--mc-blue-dark);
      border: 4px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      padding: 12px 24px;
      color: var(--mc-yellow);
      font-family: "Press Start 2P", monospace;
      font-size: 11px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0;
    }

    /* ─── HERO SECTION (DAYTIME SKY / SPLIT) ─── */
    .hero-section {
      background:
        linear-gradient(180deg, rgba(0, 124, 255, 0.96) 0%, rgba(77, 162, 255, 0.94) 62%, rgba(122, 195, 255, 0.96) 100%),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: auto, 34px 34px, 34px 34px;
      padding: 48px 24px 56px;
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid #000000;
    }

    /* Floating Clouds */
    .mc-cloud-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .mc-cloud {
      position: absolute;
      background: transparent;
      border: 0;
      width: 120px;
      height: 36px;
      animation: floatCloud linear infinite;
      box-shadow: none;
      opacity: 0.82;
    }
    .mc-cloud::before,
    .mc-cloud::after {
      content: "";
      position: absolute;
      background: #ffffff;
      border: 3px solid #000000;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.18);
    }
    .mc-cloud::before {
      left: 0;
      bottom: 0;
      width: 120px;
      height: 30px;
    }
    .mc-cloud::after {
      left: 30px;
      bottom: 22px;
      width: 58px;
      height: 24px;
      border-bottom: 0;
    }
    @keyframes floatCloud {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(calc(100vw + 150px)); }
    }

    /* Hero Grid Layout (Asymmetric) ─── */
    .hero-grid {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 34px;
      align-items: center;
      position: relative;
      z-index: 5;
    }
    .hero-content {
      text-align: left;
    }
    .hero-desc {
      font-size: 1.3rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.3);
      margin-top: 14px;
      margin-bottom: 18px;
      max-width: 620px;
    }

    .mobile-hero-mascot {
      display: none;
    }

    /* Right-Side Item Inspect Frame (3D Grass block) */
    .inspect-frame {
      background: rgba(2, 48, 71, 0.82);
      border: 4px solid var(--voxel-dark);
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.42), 6px 6px 0 var(--voxel-dark);
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ─── 3D ROTATING CSS CUBE (GRASS BLOCK) ─── */
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-white);
      color: #023047;
      border: 3px solid #000000;
      box-shadow: 3px 3px 0 #000000;
      padding: 7px 14px;
      margin-bottom: 18px;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .hero-note {
      color: #ffffff;
      font-weight: 800;
      text-shadow: 2px 2px 0 #000000;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)); /* Updated from 3 to 2 for final demo deletion */
      gap: 12px;
      max-width: 620px;
      margin-top: 18px;
    }

    .stat-block {
      background: rgba(255, 250, 240, 0.96);
      color: #082032;
      border: 3px solid #000000;
      box-shadow: 3px 3px 0 #000000;
      padding: 12px 10px;
      min-height: 68px;
    }

    .stat-block strong {
      display: block;
      color: var(--mc-yellow);
      font-family: "Press Start 2P", monospace;
      font-size: 16px;
      line-height: 1.2;
      margin-bottom: 6px;
      text-shadow: 2px 2px 0 #000000;
      -webkit-text-stroke: 1px #000000;
    }

    .stat-block span {
      display: block;
      color: #023047;
      font-family: "Fredoka", sans-serif;
      font-weight: 800;
      font-size: 13px;
      line-height: 1.2;
    }

    .mascot-frame {
      position: relative;
      width: min(100%, 520px);
      justify-self: end;
      transform: rotate(1deg);
    }

    .mascot-frame::before {
      content: "";
      position: absolute;
      inset: 12px -12px -12px 12px;
      background: var(--mc-yellow);
      border: 4px solid #000000;
      z-index: -1;
    }

    .mascot-label {
      align-self: stretch;
      background: #111111;
      border: 3px solid #000000;
      color: var(--mc-yellow);
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      padding: 10px 12px;
      text-transform: uppercase;
      text-align: left;
      letter-spacing: 0;
    }

    .hero-mascot-art {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
      border: 3px solid #000000;
      border-top: 0;
      background: #ffffff;
    }

    .hero-mini-inventory {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-self: stretch;
      padding-top: 10px;
    }

    .hero-mini-inventory span {
      background: #ffffff;
      color: #023047;
      border: 3px solid #000000;
      box-shadow: inset -3px -3px 0 #b9c3cf, inset 3px 3px 0 #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      line-height: 1.35;
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 8px 6px;
      text-transform: uppercase;
    }

    .cube-container {
      width: 140px;
      height: 140px;
      perspective: 800px;
      margin: 10px auto 8px;
      position: relative;
      animation: bobGrassBlock 3s ease-in-out infinite;
    }
    @keyframes bobGrassBlock {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 16s infinite linear;
    }
    @keyframes rotateCube {
      0% { transform: rotateX(-20deg) rotateY(0deg); }
      100% { transform: rotateX(-20deg) rotateY(360deg); }
    }
    .cube-face {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 4px solid #000000;
    }
    .cube-face.top {
      background: var(--mc-grass);
      transform: rotateX(90deg) translateZ(70px);
      box-shadow: inset -10px -10px 0 var(--mc-grass-d), inset 10px 10px 0 #7cb342;
    }
    .cube-face.bottom {
      background: var(--mc-dirt);
      transform: rotateX(-90deg) translateZ(70px);
      box-shadow: inset -10px -10px 0 #1c120a, inset 10px 10px 0 var(--mc-dirt-light);
    }
    .cube-face.front { transform: rotateY(0deg) translateZ(70px); }
    .cube-face.back { transform: rotateY(180deg) translateZ(70px); }
    .cube-face.left { transform: rotateY(-90deg) translateZ(70px); }
    .cube-face.right { transform: rotateY(90deg) translateZ(70px); }
    
    .cube-side {
      background: linear-gradient(to bottom, var(--mc-grass) 24px, var(--mc-grass-d) 24px, var(--mc-grass-d) 32px, var(--mc-dirt) 32px);
      box-shadow: inset -5px 0 0 rgba(0,0,0,0.15);
    }

    /* Stone Pedestal */
    .stone-pedestal {
      width: 110px;
      height: 12px;
      background: var(--mc-stone);
      border: 4px solid #000000;
      box-shadow: inset -2px -2px 0 #555555, inset 2px 2px 0 #ffffff, 2px 2px 0px #000000;
      margin: 0 auto;
    }

    /* ─── DIRT / GRASS TRANSITIONS ─── */
    .grass-separator {
      height: 20px;
      background: var(--mc-grass);
      border-bottom: 5px solid var(--mc-grass-d);
      position: relative;
      z-index: 10;
    }
    .dirt-separator {
      height: 30px;
      background: var(--mc-dirt);
      background-image: repeating-linear-gradient(45deg, var(--mc-dirt) 0px, var(--mc-dirt) 10px, var(--mc-dirt-light) 10px, var(--mc-dirt-light) 20px);
      border-bottom: 4px solid #000000;
      position: relative;
      z-index: 10;
    }

    /* ─── SECTIONS & GRID CARDS ─── */
    .mc-section {
      padding: 92px 24px;
      max-width: 1180px;
      margin: 0 auto;
    }
    .mc-title-wrap {
      text-align: center;
      margin-bottom: 56px;
    }
    .mc-section-title {
      font-family: "Fredoka", sans-serif;
      font-weight: 800;
      font-size: 2.8rem;
      color: var(--mc-yellow);
      text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 3px 3px 0px #000000;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .mc-section-subtitle {
      background: var(--mc-blue-dark);
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 18px;
      border: 3px solid #000000;
      box-shadow: 2px 2px 0px #000000;
      display: inline-block;
      margin-top: 10px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    /* Asymmetric About Grid */
    .about-split-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 46px;
      align-items: center;
    }
    .about-info-desc {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .about-info-desc p {
      font-size: 1.25rem;
      line-height: 1.7;
      color: #e2e8f0;
    }

    .quest-summary {
      background: #111111;
      border: 4px solid #000000;
      box-shadow: inset -4px -4px 0 #050505, inset 4px 4px 0 #333333, 5px 5px 0 #000000;
      padding: 22px;
    }

    .quest-summary-title {
      color: var(--mc-yellow);
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .quest-list {
      display: grid;
      gap: 12px;
    }

    .quest-list span {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #ffffff;
      border-bottom: 2px solid #333333;
      padding-bottom: 10px;
      font-weight: 800;
    }

    .quest-list strong {
      color: #55ff55;
      text-align: right;
    }
    
    /* Outlined White Cards */
    .pillars-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .voxel-card {
      background: var(--panel-white);
      border: 4px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      color: #373737;
      padding: 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      text-align: left;
    }
    .voxel-card:hover {
      background: #f8fafc;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }
    .voxel-item-frame {
      width: 52px;
      height: 52px;
      background: #8b8b8b;
      border: 3px solid #373737;
      box-shadow: inset -3px -3px 0 #555555, inset 3px 3px 0 #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
    }
    .pillar-card-title {
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #000000;
      margin-bottom: 4px;
    }
    .pillar-card-text {
      font-size: 1.02rem;
      line-height: 1.4;
      color: #555555;
    }

    /* ─── WORKSHOPS ─── */
    .workshops-bg {
      background:
        linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15)),
        radial-gradient(#2d2d2d 20%, transparent 20%),
        radial-gradient(#2d2d2d 20%, transparent 20%);
      background-color: #404040;
      background-size: auto, 16px 16px, 16px 16px;
      background-position: 0 0, 0 0, 8px 8px;
      border-top: 4px solid #000000;
      border-bottom: 4px solid #000000;
      padding: 92px 24px;
    }
    .ws-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 40px;
    }
    .ws-voxel-card {
      flex-direction: column;
      align-items: center;
      text-align: center;
      height: 100%;
      justify-content: space-between;
      min-height: 250px;
    }
    .ws-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 12px auto 8px auto;
    }
    .ws-art {
      width: 100%;
      aspect-ratio: 1 / 0.78;
      object-fit: contain;
      background: #f7f1e8;
      border: 3px solid #000000;
      box-shadow: inset -4px -4px 0 #d7d0c5, inset 4px 4px 0 #ffffff;
      margin-bottom: 16px;
      padding: 10px;
    }
    .ws-voxel-card h3 {
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #000000;
      line-height: 1.1;
    }
    .ws-voxel-card p {
      font-size: 1.02rem;
      line-height: 1.5;
      color: #555555;
      margin-top: 8px;
      margin-bottom: 12px;
      text-align: center;
    }
    .ws-tag-outline {
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 9px;
      background: var(--voxel-gray);
      border: 2px solid #000000;
      padding: 4px 8px;
      color: #333333;
      align-self: center;
    }

    /* ─── ORIGINAL GAME BUTTONS ─── */
    .mc-button {
      background: #9e9e9e;
      border: 4px solid #000000;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      text-shadow: 2px 2px 0px #373737;
      box-shadow: inset -4px -4px 0px #5e5e5e, inset 4px 4px 0px #dbdbdb;
      padding: 14px 28px;
      text-align: center;
      cursor: pointer;
      display: inline-block;
      text-decoration: none;
      user-select: none;
    }
    .mc-button:hover:not(:disabled) {
      background: #3c8527;
      box-shadow: inset -4px -4px 0px #1e4b14, inset 4px 4px 0px #70c451;
      text-shadow: 2px 2px 0px #14330d;
    }
    .mc-button:active:not(:disabled) {

function Form() {
  const [form, setForm] = useState({ 
    fullName: "", 
    email: "", 
    phone: "", 
    studentId: "", 
    majorAndLevel: "", 
    scientificExp: "1", 
    socialProfile: "", 
    goal: "", 
    commitment: false, 
    terms: false 
  });
  const [status, setStatus] = useState(null);
  const [msg, setMsg] = useState("");
  const [loading, setLoading] = useState(false);
  const [showModal, setShowModal] = useState(false);
  const [paused, setPaused] = useState(false);

  useEffect(() => {
    if (firestoreDb) {
      const unsubscribe = firestoreDb.collection("quizzes").doc("day0_quiz_VISITOR_STATS").onSnapshot((doc) => {
        if (doc.exists) {
          setPaused(!!doc.data().registrationsPaused);
        }
      }, (err) => {
        console.error("Error listening to settings:", err);
      });
      return () => unsubscribe();
    }
  }, []);

  const change = (e) => {
    const { name, value, type, checked } = e.target;
    setForm({ ...form, [name]: type === "checkbox" ? checked : value });
  };

  const submit = async () => {
    if (!form.fullName || !form.email || !form.phone || !form.studentId || !form.majorAndLevel || !form.scientificExp || !form.socialProfile || !form.goal || !form.commitment || !form.terms) {
      setStatus("error");
      setMsg("Please fill in all fields and check both agreement boxes.");
      return;
    }
    setLoading(true);
    setStatus(null);

    // Generate a random 6-character registration password (e.g., QS-X54A)
    const generatedPassword = "QS-" + Math.random().toString(36).substring(2, 6).toUpperCase();

    let firestoreSuccess = false;
    let googleFormSuccess = false;
    let localSuccess = false;

    // 1. Submit to Firebase Firestore (if initialized)
    if (firestoreDb) {
      try {
        // Register the student in Firebase Auth natively first
        await firebase.auth().createUserWithEmailAndPassword(form.email.trim(), generatedPassword);
        await firebase.auth().signOut(); // Immediately sign out so they remain guests on the landing page

        await firestoreDb.collection("registrations").add({
          fullName: form.fullName,
          email: form.email.trim(),
          phone: form.phone,
          studentId: form.studentId,
          majorAndLevel: form.majorAndLevel,
          scientificExp: parseInt(form.scientificExp),
          socialProfile: form.socialProfile,
          commitment: form.commitment,
          terms: form.terms,
          password: generatedPassword,
          status: "Pending",
          emailSent: false,
          attendance: {},
          workshopsLevel: 1,
          qcmScore: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        firestoreSuccess = true;
      } catch (e) {
        console.error("Firebase Auth or Firestore write failed:", e);
        if (e.code === "auth/email-already-in-use") {
          setStatus("error");
          setMsg("This email address is already registered.");
          setLoading(false);
          return;
        }
      }
    }

    // 2. Submit to Google Sheets via Apps Script Web App (if configured)
    if (APPS_SCRIPT_WEB_APP_URL) {
      try {
        await fetch(APPS_SCRIPT_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...form, password: generatedPassword })
        });
        googleFormSuccess = true;
      } catch (e) {
        console.error("Apps Script submission failed:", e);
      }
    }

    // 3. Local Express server submission (fallback)
    try {
      const r = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...form, password: generatedPassword })
      });
      if (r.ok) localSuccess = true;
    } catch (e) {
      // Ignore connection errors if server.js is not running
    }

    // 4. Update UI Status
    if (firestoreSuccess || googleFormSuccess || localSuccess) {
      setStatus(null);
      setMsg("");
      setForm({ fullName: "", email: "", phone: "", studentId: "", majorAndLevel: "", scientificExp: "1", socialProfile: "", goal: "", commitment: false, terms: false });
      setShowModal(true);
    } else {
      setStatus("error");
      setMsg("Failed to save registration. Please check your network connection.");
    }
    setLoading(false);
  };

  return (
    <>
      <section className="form-bg" id="register">
        <div className="form-box">
          <div className="form-layout">
            <div className="mc-dark-panel">
              <div className="mc-form-header">
                <h2>📜 SIGN-UP REGISTRY</h2>
                <p style={{ color: "#8b8b8b", marginTop: "6px", fontSize: "1.4rem" }}>
                  Secure a server slot for the camp edition 2026.
                </p>
              </div>
  
              {paused ? (
                <div style={{ padding: "40px 10px", textAlign: "center" }}>
                  <p style={{ color: "#f87171", fontSize: "1.2rem", fontFamily: "'Press Start 2P', monospace", margin: "20px 0", lineHeight: "1.6" }}>
                    ⚠️ REGISTRATIONS ARE CLOSED
                  </p>
                  <p style={{ color: "#cbd5e1", fontSize: "1.1rem", lineHeight: "1.6", marginBottom: "20px" }}>
                    The registration portal is temporarily closed by the administrators. Please check back later or contact the camp coordinators for slot availability.
                  </p>
                  <div className="achievement-alert" style={{ background: "#1a1a24", border: "3px solid #ef4444", display: "inline-flex", padding: "12px 20px", width: "100%", boxSizing: "border-box" }}>
                    <div className="achievement-icon">🔒</div>
                    <div className="achievement-details" style={{ textAlign: "left" }}>
                      <div className="achievement-title" style={{ color: "#ef4444" }}>Registry Locked</div>
                      <div className="achievement-msg" style={{ fontSize: "0.95rem" }}>New candidate applications are currently paused.</div>
                    </div>
                  </div>
                </div>
              ) : (
                <>
                  {status === "error" && (
                <div className="achievement-alert" style={{ background: "#991b1b", border: "3px solid #7f1d1d", marginBottom: "16px" }}>
                  <div className="achievement-icon">⚠️</div>
                  <div className="achievement-details">
                    <div className="achievement-title" style={{ color: "#f87171" }}>System Error!</div>
                    <div className="achievement-msg" style={{ fontSize: "1.05rem" }}>{msg}</div>
                  </div>
                </div>
              )}
  
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: "14px 20px" }}>
                <div className="form-group-voxel" style={{ marginBottom: 0 }}>

                  <input

function Footer() {
  const [visitorCount, setVisitorCount] = useState(null);

  useEffect(() => {
    if (typeof firestoreDb === "undefined" || !firestoreDb) return;

    const trackVisitor = async () => {
      try {
        const docRef = firestoreDb.collection("quizzes").doc("day0_quiz_VISITOR_STATS");
        const hasBeenCounted = sessionStorage.getItem("qssc3_visitor_counted");
        
        let currentCount = 0;
        const doc = await docRef.get();
        if (doc.exists) {
          currentCount = doc.data().points || 0;
        }

        if (!hasBeenCounted) {
          currentCount += 1;
          await docRef.set({
            day: 0,
            question: "VISITOR STATS (DO NOT DELETE)",
            options: ["", "", "", ""],
            correctIndex: 0,
            points: currentCount,
            active: false
          }, { merge: true });
          sessionStorage.setItem("qssc3_visitor_counted", "true");
        }
        
        setVisitorCount(currentCount);
      } catch (e) {
        console.error("Failed to track visitor:", e);
      }
    };

    trackVisitor();
  }, []);

  return (
    <footer>
      <p>© 2026 <strong>Quanta Club · Summer Camp 3rd Edition</strong> · University of Algiers 1 - Faculty of Sciences</p>
      <p className="footer-log">
        📍 Visitor Count: {visitorCount !== null ? `${visitorCount} views` : "Loading..."}
      </p>
    </footer>
  );
}

    let secondaryApp;
    try {

    } catch (e) {
      secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryAuth");
    }
    const secAuth = secondaryApp.auth();
    try {
      // Sign in with the old credentials to allow modifying them
      await secAuth.signInWithEmailAndPassword(oldEmail || newEmail, oldPassword || newPassword);
      const user = secAuth.currentUser;
      if (user) {
        if (newEmail && newEmail.toLowerCase() !== (oldEmail || "").toLowerCase()) {
          await user.updateEmail(newEmail.trim());
        }
        if (newPassword && newPassword !== oldPassword) {
          await user.updatePassword(newPassword);
        }
      }
      await secAuth.signOut();
    } catch (err) {
      // If user doesn't exist yet (or wrong password caused by direct auth inconsistency), create them
      if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password") {
        try {
          await secAuth.createUserWithEmailAndPassword(newEmail.trim(), newPassword);
          await secAuth.signOut();

        }
      });
      list.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' }));
      setQuizzes(list);

      console.error("Error fetching quizzes:", e);

  const fetchRoadmap = async () => {
    if (!firestoreDb) return;
    try {
      const doc = await firestoreDb.collection("quizzes").doc("day0_quiz_CAMP_ROADMAP").get();
      if (doc.exists) {
        const data = doc.data();
        if (data.options && data.options[0]) {
          try {
            const parsed = JSON.parse(data.options[0]);
            if (parsed && parsed.length >= DEFAULT_CAMP_ROADMAP.length) {
              setRoadmapItems(parsed);
              return;
            }
          } catch(e) { }
        }
      } else {
        const docOld = await firestoreDb.collection("quizzes").doc("__CAMP_ROADMAP__").get();
        if (docOld.exists) {
          const data = docOld.data();
          if (data.items && data.items.length >= DEFAULT_CAMP_ROADMAP.length) {
            setRoadmapItems(data.items);
            return;
          }
        }
      }
      setRoadmapItems(DEFAULT_CAMP_ROADMAP);
    } catch (e) {
      console.error("Error fetching roadmap:", e);
      setRoadmapItems(DEFAULT_CAMP_ROADMAP);
    }

        {/* Tab 3: Stats & Leaderboard */}
        {activeTab === "leaderboard" && (

            {/* Sub-tabs Selection */}

                className="mc-button"
                style={{ padding: "8px 16px", fontSize: "10px", background: leaderboardSubTab === "xp" ? "var(--mc-yellow)" : "#1e293b", color: leaderboardSubTab === "xp" ? "#000" : "#fff", border: "3px solid #000" }}
              >

              </button>
              <button 
                onClick={() => { setLeaderboardSubTab("series"); if (quizSubmissions.length === 0) fetchAllSubmissions(); }}
                className="mc-button"
                style={{ padding: "8px 16px", fontSize: "10px", background: leaderboardSubTab === "series" ? "var(--mc-yellow)" : "#1e293b", color: leaderboardSubTab === "series" ? "#000" : "#fff", border: "3px solid #000" }}
              >
                🧠 Quiz Series Scoreboard
              </button>
            </div>

            {leaderboardSubTab === "xp" ? (
              <div style={{ display: "grid", gridTemplateColumns: "1.2fr 0.8fr", gap: "30px" }} className="portal-grid">
                
                {/* Leaderboard Table */}
                <div className="mc-dark-panel" style={{ padding: "26px", border: "4px solid #000", background: "#18181f" }}>
                  <h3 style={{ fontFamily: "'Press Start 2P', monospace", fontSize: "10px", color: "var(--mc-yellow)", marginBottom: "20px" }}>
                    📊 CAMP LEADERBOARD (XP RANKING)
                  </h3>
                  <div style={{ overflowX: "auto" }}>
                    <table className="responsive-table" style={{ width: "100%", borderCollapse: "collapse", color: "#fff", fontSize: "1.25rem" }}>
                      <thead>
                        <tr style={{ background: "#023047", borderBottom: "3px solid #000" }}>
                          <th style={{ padding: "10px", textAlign: "center" }}>Rank</th>
                          <th style={{ padding: "10px", textAlign: "left" }}>Participant</th>
                          <th style={{ padding: "10px", textAlign: "center" }}>Level</th>
                          <th style={{ padding: "10px", textAlign: "center" }}>Quiz Score</th>
                          <th style={{ padding: "10px", textAlign: "center" }}>Exam Score</th>
                          <th style={{ padding: "10px", textAlign: "center" }}>Attendance Score</th>
                          <th style={{ padding: "10px", textAlign: "center" }}>Total XP</th>
                        </tr>
                      </thead>
                      <tbody>
                        {[...registrations]
                          .sort((a, b) => {
                            const aAttended = Object.values(a.attendance || {}).filter(val => val === true).length;
                            const bAttended = Object.values(b.attendance || {}).filter(val => val === true).length;
                            const aXP = (a.qcmScore || 0) + (a.examScore || 0) * 25 + ((a.workshopsLevel || 1) * 100) + (aAttended * 50) + (a.giftPoints || 0);
                            const bXP = (b.qcmScore || 0) + (b.examScore || 0) * 25 + ((b.workshopsLevel || 1) * 100) + (bAttended * 50) + (b.giftPoints || 0);
                            
                            const xpDiff = bXP - aXP;
                            if (xpDiff !== 0) return xpDiff;
                            
                            // Tie-breaker: earlier quiz reply time is ranked first
                            const getSubmitTime = (r) => {
                              if (r.lastQuizSubmittedAt) {
                                if (r.lastQuizSubmittedAt.seconds !== undefined) return r.lastQuizSubmittedAt.seconds;
                                  return new Date(r.lastQuizSubmittedAt).getTime() / 1000;
                              }
                              return r.rawDate || 0;
                            };
                            return getSubmitTime(a) - getSubmitTime(b);
                          })
                          .map((r, index) => {
                            const attendedSessions = Object.values(r.attendance || {}).filter(val => val === true).length;
                            const attendanceScore = attendedSessions * 50;
                            const totalXP = (r.qcmScore || 0) + (r.examScore || 0) * 25 + (r.workshopsLevel || 1) * 100 + attendanceScore + (r.giftPoints || 0);

                                <td style={{ padding: "10px", textAlign: "center", color: "#38bdf8" }}>{attendanceScore} pts ({attendedSessions} check-ins)</td>

                    </h3>

                        <span style={{ color: "#94a3b8", display: "block", fontSize: "1.1rem", marginTop: "4px" }}>{bestParticipant.email}</span>
                        
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr", gap: "6px", marginTop: "16px" }}>
                          <div style={{ background: "#1c1c24", border: "2px solid #000", padding: "6px" }}>

                            <strong style={{ color: "#55ff55", fontSize: "1rem" }}>Lvl {bestParticipant.workshopsLevel}</strong>
                          </div>
                          <div style={{ background: "#1c1c24", border: "2px solid #000", padding: "6px" }}>
                            <span style={{ fontSize: "7px", display: "block", color: "#94a3b8", textTransform: "uppercase" }}>Quiz</span>
                            <strong style={{ color: "var(--mc-yellow)", fontSize: "1rem" }}>{bestParticipant.qcmScore || 0} pts</strong>
                          </div>
                          <div style={{ background: "#1c1c24", border: "2px solid #000", padding: "6px" }}>
                            <span style={{ fontSize: "7px", display: "block", color: "#94a3b8", textTransform: "uppercase" }}>Exam</span>
                            <strong style={{ color: "#f59e0b", fontSize: "1rem" }}>{bestParticipant.examScore || 0} pts</strong>
                          </div>
                          <div style={{ background: "#1c1c24", border: "2px solid #000", padding: "6px" }}>
                            <span style={{ fontSize: "7px", display: "block", color: "#94a3b8", textTransform: "uppercase" }}>Att</span>
                            <strong style={{ color: "#38bdf8", fontSize: "1rem" }}>{Object.values(bestParticipant.attendance || {}).filter(val => val === true).length * 50} pts</strong>
                          </div>
                          <div style={{ background: "#1c1c24", border: "2px solid #000", padding: "6px" }}>
                            <span style={{ fontSize: "7px", display: "block", color: "#94a3b8", textTransform: "uppercase" }}>Gift</span>
                            <strong style={{ color: "#e0f2fe", fontSize: "1rem" }}>{bestParticipant.giftPoints || 0} pts</strong>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div style={{ color: "#8b8b8b", textAlign: "center" }}>No participants logged.</div>
                    )}
                  </div>

                  {/* Statistics Overview */}
                  <div className="mc-dark-panel" style={{ padding: "24px", border: "4px solid #000", background: "#1c1c24" }}>
                    <h3 style={{ fontFamily: "'Press Start 2P', monospace", fontSize: "9px", color: "var(--mc-yellow)", marginBottom: "16px" }}>
                      📈 REGISTRATION METRICS
                    </h3>
                    <div style={{ display: "flex", flexDirection: "column", gap: "10px", fontSize: "1.2rem" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", borderBottom: "1.5px solid #2d3748", paddingBottom: "8px" }}>
                        <span>Accepted Admits:</span>
                        <strong style={{ color: "#55ff55" }}>{registrations.filter(r => r.status === "Accepted").length}</strong>
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", borderBottom: "1.5px solid #2d3748", paddingBottom: "8px" }}>
                        <span>Pending Candidates:</span>
                        <strong style={{ color: "var(--mc-yellow)" }}>{registrations.filter(r => r.status === "Pending").length}</strong>
                      </div>

                      <div style={{ display: "flex", justifyContent: "space-between", paddingBottom: "4px" }}>
                        <span>Active Daily Quizzes:</span>

                  </div>

            ) : (

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "24px", flexWrap: "wrap", gap: "12px" }}>
                  <h3 style={{ fontFamily: "'Press Start 2P', monospace", fontSize: "10px", color: "var(--mc-yellow)", margin: 0 }}>

                  </h3>
                  <button 
                    onClick={fetchAllSubmissions} 
                    className="mc-button" 
                    style={{ padding: "8px 12px", fontSize: "9px", background: "#0284c7" }}
                    disabled={loadingSubmissions}
                  >
                    {loadingSubmissions ? "⏳ Loading..." : "🔄 Refresh Quiz Data"}
                  </button>
                </div>

                {loadingSubmissions ? (
                  <div style={{ textAlign: "center", padding: "40px", color: "#8b8b8b" }}>
                    <div style={{ display: "inline-block", width: "24px", height: "24px", border: "3px solid #fff", borderTopColor: "transparent", borderRadius: "50%", animation: "spin 1s linear infinite", marginBottom: "10px" }} />
                    <div style={{ fontSize: "1.1rem" }}>Fetching submissions from database...</div>
                  </div>
                ) : quizSubmissions.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "40px", color: "#8b8b8b", background: "#0c1f2d", border: "2px solid #000" }}>
                    No quiz submissions loaded yet. Click "Refresh Quiz Data" to retrieve scores.
                  </div>
                ) : (() => {
                  // Find all unique series prefixes
                  const seriesList = Array.from(new Set(
                    quizzes
                      .map(q => {
                        const idStr = String(q.id);
                        return idStr.includes('_') ? idStr.split('_')[0] : idStr;
                      })
                      .filter(prefix => prefix.startsWith("day"))
                  )).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

                  // Calculate max points for each series
                  const seriesMaxMap = {};
                  seriesList.forEach(series => {
                    seriesMaxMap[series] = quizzes
                      .filter(q => {
                        const idStr = String(q.id);
                        const prefix = idStr.includes('_') ? idStr.split('_')[0] : idStr;
                        return prefix === series;
                      })
                      .reduce((sum, q) => sum + (parseInt(q.points) || 10), 0);
                  });

                  // Calculate score of each accepted participant in each series
                  const participantsScores = registrations
                    .filter(r => r.status === "Accepted")
                    .map(r => {
                      const scores = {};
                      let totalPointsEarned = 0;
                      seriesList.forEach(series => {
                        const earned = quizSubmissions
                          .filter(sub => sub.email === r.email && (sub.quizId.includes('_') ? sub.quizId.split('_')[0] : sub.quizId) === series)
                          .reduce((sum, sub) => sum + (sub.isCorrect ? (parseInt(sub.score) || 10) : 0), 0);
                        scores[series] = earned;
                        totalPointsEarned += earned;
                      });
                      return {
                        id: r.id,
                        fullName: r.fullName,
                        email: r.email,
                        scores: scores,
                        totalQuizScore: totalPointsEarned,
                        rawDate: r.rawDate || 0,
                        submissions: quizSubmissions.filter(sub => sub.email === r.email)
                      };
                    });

                  // Determine sorting
                  const getLatestSubTimeForSeries = (p, seriesId) => {
                    const subs = p.submissions.filter(sub => {
                      const prefix = sub.quizId.includes('_') ? sub.quizId.split('_')[0] : sub.quizId;
                      return seriesId === "total" ? prefix.startsWith("day") : prefix === seriesId;
                    });
                    if (subs.length === 0) return Infinity; // No submissions = last
                    const times = subs.map(s => {
                      if (s.submittedAt && s.submittedAt.seconds !== undefined) return s.submittedAt.seconds;
                      if (s.submittedAt) return new Date(s.submittedAt).getTime() / 1000;
                      return 0;
                    });
                    return Math.max(...times);
                  };

                  const sortedParticipants = [...participantsScores].sort((a, b) => {
                    const targetSeries = sortBySeries;
                    if (targetSeries === "total") {
                      const scoreDiff = b.totalQuizScore - a.totalQuizScore;
                      if (scoreDiff !== 0) return scoreDiff;
                      
                      const timeA = getLatestSubTimeForSeries(a, "total");
                      const timeB = getLatestSubTimeForSeries(b, "total");
                      if (timeA !== timeB) return timeA - timeB;
                      return a.rawDate - b.rawDate;
                    } else {
                      const scoreDiff = (b.scores[targetSeries] || 0) - (a.scores[targetSeries] || 0);
                      if (scoreDiff !== 0) return scoreDiff;
                      
                      const timeA = getLatestSubTimeForSeries(a, targetSeries);
                      const timeB = getLatestSubTimeForSeries(b, targetSeries);
                      if (timeA !== timeB) return timeA - timeB;
                      return a.rawDate - b.rawDate;
                    }
                  });

                  // Highlight Best Player(s) for the sorted metric
                  const highestScore = sortedParticipants.length > 0
                    ? (sortBySeries === "total" ? sortedParticipants[0].totalQuizScore : (sortedParticipants[0].scores[sortBySeries] || 0))
                    : 0;
                  
                  const bestPlayers = sortedParticipants.filter(p => {
                    const score = sortBySeries === "total" ? p.totalQuizScore : (p.scores[sortBySeries] || 0);
                    return score > 0 && score === highestScore;
                  });

                  return (
                    <div>
                      {/* Dropdown & Highlights */}
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px", marginBottom: "20px" }} className="portal-grid">
                        <div className="mc-dark-panel" style={{ background: "#0c1f2d", padding: "16px", border: "2px solid #000" }}>
                          <label style={{ display: "block", color: "#cbd5e1", fontSize: "1.1rem", fontWeight: "bold", marginBottom: "8px" }}>
                            🔍 Sort & Rank By:
                          </label>
                          <select 
                            value={sortBySeries} 
                            onChange={(e) => setSortBySeries(e.target.value)}
                            className="mc-input"
                            style={{ width: "100%", padding: "10px", background: "#000", color: "#fff", border: "2px solid #555" }}
                          >
                            <option value="total">🏆 Total Quiz Score</option>
                            {seriesList.map(series => (
                              <option key={series} value={series}>
                                🧠 {series.toUpperCase()} (Max: {seriesMaxMap[series]} pts)
                              </option>
                            ))}
                          </select>
                        </div>

                        <div className="mc-dark-panel" style={{ background: "#1e3a8a", padding: "16px", border: "2px solid #000", display: "flex", flexDirection: "column", justifyContent: "center" }}>
                          <span style={{ fontSize: "7px", fontFamily: "'Press Start 2P', monospace", color: "var(--mc-yellow)", textTransform: "uppercase", display: "block", marginBottom: "6px" }}>
                            ⭐ Best Player(s) for {sortBySeries === "total" ? "Total Quiz Score" : sortBySeries.toUpperCase()}:
                          </span>
                          {bestPlayers.length > 0 ? (
                            <div style={{ color: "#fff" }}>
                              <strong style={{ fontSize: "1.5rem" }}>
                                👑 {bestPlayers.map(p => p.fullName).join(", ")}
                              </strong>
                              <span style={{ display: "block", fontSize: "1.1rem", color: "#93c5fd", marginTop: "2px" }}>
                                Score: {highestScore} pts {sortBySeries !== "total" && `/ ${seriesMaxMap[sortBySeries]} pts`}
                              </span>
                            </div>
                          ) : (
                            <span style={{ color: "#93c5fd", fontSize: "1.1rem" }}>No scores recorded yet.</span>
                          )}
                        </div>
                      </div>

                      {/* Scoreboard Table */}
                      <div style={{ overflowX: "auto" }}>
                        <table className="responsive-table" style={{ width: "100%", borderCollapse: "collapse", color: "#fff", fontSize: "1.2rem" }}>
                          <thead>
                            <tr style={{ background: "#023047", borderBottom: "3px solid #000" }}>
                              <th style={{ padding: "10px", textAlign: "center" }}>Rank</th>
                              <th style={{ padding: "10px", textAlign: "left" }}>Participant</th>
                              <th style={{ padding: "10px", textAlign: "left" }}>Email</th>
                              {seriesList.map(series => (
                                <th key={series} style={{ padding: "10px", textAlign: "center" }}>
                                  {series.toUpperCase()}
                                  <span style={{ display: "block", fontSize: "8px", color: "#38bdf8", fontWeight: "normal", marginTop: "2px" }}>
                                    (Max: {seriesMaxMap[series]})
                                  </span>
                                </th>
                              ))}
                              <th style={{ padding: "10px", textAlign: "center", color: "var(--mc-yellow)" }}>Total Quiz</th>
                            </tr>
                          </thead>
                          <tbody>
                            {sortedParticipants.map((p, index) => {
                              const isTop = index < bestPlayers.length && highestScore > 0;
                              return (
                                <tr key={p.id} style={{ borderBottom: "1.5px solid #000", background: isTop ? "#1e3a8a" : (index % 2 === 0 ? "#1c1c24" : "#24242f") }}>
                                  <td style={{ padding: "10px", textAlign: "center", fontWeight: "bold" }}>
                                    {isTop ? "👑" : `#${index + 1}`}
                                  </td>
                                  <td style={{ padding: "10px", fontWeight: isTop ? "bold" : "normal" }}>{p.fullName}</td>
                                  <td style={{ padding: "10px", color: "#cbd5e1" }}>{p.email}</td>
                                  {seriesList.map(series => {
                                    const score = p.scores[series] || 0;
                                    const max = seriesMaxMap[series] || 1;
                                    const pct = (score / max) * 100;
                                    let scoreColor = "#94a3b8";
                                    if (score > 0) {
                                      if (pct >= 80) scoreColor = "#22c55e"; // Green
                                      else if (pct >= 50) scoreColor = "var(--mc-yellow)"; // Yellow
                                      else scoreColor = "#f97316"; // Orange
                                    }
                                    return (
                                      <td key={series} style={{ padding: "10px", textAlign: "center", color: scoreColor, fontWeight: score > 0 ? "bold" : "normal" }}>
                                        {score} pts
                                      </td>
                                    );
                                  })}
                                  <td style={{ padding: "10px", textAlign: "center", color: "var(--mc-yellow)", fontWeight: "bold" }}>
                                    {p.totalQuizScore} pts
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

          </div>
        )}

        {/* Tab 4: Settings / Change Password */}
        {activeTab === "settings" && (
          <div style={{ display: "flex", flexDirection: "column", gap: "20px", maxWidth: "500px", margin: "0 auto", marginBottom: "40px" }}>
            <div className="mc-dark-panel" style={{ padding: "30px", border: "4px solid #000", background: "#1c1c24" }}>
              <h3 style={{ fontFamily: "'Press Start 2P', monospace", fontSize: "10px", color: "var(--mc-yellow)", marginBottom: "20px", textAlign: "center" }}>
                ⚙️ ADMIN SECURITY SETTINGS
              </h3>
              
              <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                <div className="form-group-voxel" style={{ marginBottom: 0 }}>
                  <label>🔑 New Admin Password</label>
                  <input 
                    type="password" 
                    value={newAdminPassword} 
                    onChange={(e) => setNewAdminPassword(e.target.value)} 
                    className="mc-input"
                    placeholder="Enter new secure password"
                    style={{ background: "#000", color: "#fff", padding: "12px", width: "100%" }}
                  />
                </div>

                <div className="form-group-voxel" style={{ marginBottom: 0 }}>
                  <label>🔁 Confirm Password</label>
                  <input 
                    type="password" 
                    value={confirmAdminPassword} 
                    onChange={(e) => setConfirmAdminPassword(e.target.value)} 
                    className="mc-input"
                    placeholder="Repeat new password"
                    style={{ background: "#000", color: "#fff", padding: "12px", width: "100%" }}
                  />
                </div>

                <button 
                  className="mc-button" 
                  onClick={handleUpdateAdminPassword}
                  style={{ padding: "14px", fontSize: "11px", background: "#4caf50", marginTop: "10px" }}
                >
                  💾 UPDATE PASSWORD
                </button>
              </div>
            </div>

            <div className="mc-dark-panel" style={{ padding: "30px", border: "4px solid #000", background: "#1c1c24" }}>
              <h3 style={{ fontFamily: "'Press Start 2P', monospace", fontSize: "10px", color: "var(--mc-yellow)", marginBottom: "20px", textAlign: "center" }}>
                📢 CAMP ANNOUNCEMENT (NOTIFICATION)
              </h3>
              <p style={{ color: "#cbd5e1", fontSize: "1.1rem", lineHeight: "1.5", marginBottom: "16px", textAlign: "center" }}>
                Broadcast an alert notice banner to all participant portals in real-time.
              </p>
              <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                <textarea

    if (!participant) return 0;

    return (participant.qcmScore || 0)
      + ((participant.examScore || 0) * 25)
      + ((participant.workshopsLevel || 1) * 100)
      + (attended * 50)
      + (participant.giftPoints || 0);
  };

    const submittedAt = participant && participant.lastQuizSubmittedAt;
    if (submittedAt) {
      if (submittedAt.seconds !== undefined) return submittedAt.seconds;
      const parsed = new Date(submittedAt).getTime();
      if (!Number.isNaN(parsed)) return parsed / 1000;
    }

    const createdAt = participant && (participant.createdAt || participant.rawDate);
    if (createdAt && createdAt.seconds !== undefined) return createdAt.seconds;
    const parsedCreatedAt = createdAt ? new Date(createdAt).getTime() : 0;
    return Number.isNaN(parsedCreatedAt) ? 0 : parsedCreatedAt / 1000;
  };

  const compareParticipantsByRank = (a, b) => {
    const xpDifference = calculateParticipantXP(b) - calculateParticipantXP(a);
    if (xpDifference !== 0) return xpDifference;
    return getParticipantSubmitTime(a) - getParticipantSubmitTime(b);

      .findIndex(participant => (participant.email || "").trim().toLowerCase() === normalizedEmail);

    if (rankIndex === -1) return "N/A";
    const rankMedals = ["🥇", "🥈", "🥉"];

      const now = Date.now();
      if (now - lastLogged < 2000) return; // Debounce 2 seconds
      lastLogged = now;
      
      console.log("Anti-cheat: Tab switch or blur detected.");
      
      // Update local state instantly so the warning banner shows up immediately
      setTabSwitchesCount(prev => {
        const nextVal = prev + 1;

        return nextVal;

    };

    document.addEventListener("visibilitychange", handleVisibilityChange);

    try {
      const code = tokenString.toUpperCase().trim();
      let matchedKey = null;
      for (const [key, val] of Object.entries(PREGENERATED_CODES)) {
        if (val === code) {
          matchedKey = key;
          break;
        }
      }
      if (matchedKey) {
        const [dayStr, sessionStr] = matchedKey.split('_');
        const dayNum = dayStr.replace('day', '');
        
        const userSnap = await firestoreDb.collection("registrations").doc(uId).get();
        if (userSnap.exists) {
          const uData = userSnap.data();
          const currentAttendance = uData.attendance || {};
          if (!currentAttendance[matchedKey]) {
            const updated = { ...currentAttendance, [matchedKey]: true };
            const attendedCount = Object.values(updated).filter(val => val === true).length;
            const newLevel = 1 + (attendedCount * 0.5);
            await firestoreDb.collection("registrations").doc(uId).update({ 
              attendance: updated,
              workshopsLevel: newLevel
            });
            setUserDoc(prev => prev ? { ...prev, attendance: updated, workshopsLevel: newLevel } : null);
            alert(`✅ SECURE CHECK-IN SUCCESSFUL: Day ${dayNum} ${sessionStr.toUpperCase()}!`);

              const url = window.location.protocol + "//" + window.location.host + window.location.pathname;
              window.history.replaceState({path:url}, '', url);
            }
          } else {
            alert(`You are already checked in for Day ${dayNum} ${sessionStr.toUpperCase()}.`);
          }
        }
      } else {
        alert("❌ Invalid or expired secure check-in code.");
      }
    } catch (e) {
      console.error("Checkin error:", e);
      alert("Error processing check-in.");
    }
  };

      firestoreDb.collection("quiz_submissions").doc(`${email.trim()}_${quiz.id}`).set({

      if (isCorrect) {

        return prefix === dayPrefix;

      const unansweredCount = dayQuizzes.filter(q => q.id !== quiz.id && (submissions || {})[String(q.id)] === undefined).length;

      if (isLastUnanswered) {

        setQuizModalIcon("🏆");

        dayQuizzes.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true, sensitivity: 'base' }));
        const nextUnansweredIdx = dayQuizzes.findIndex(q => q.id !== quiz.id && (submissions || {})[String(q.id)] === undefined);
        if (nextUnansweredIdx !== -1) {

                          const isCorrect = subDoc && subDoc.isCorrect;

                                  const isSelectedIncorrect = optIdx === selectedOptIdx && !isCorrectOption;
                                  
                                  let optionBg = "#131d2a";
                                  let optionBorder = "#1e293b";
                                  let optionColor = "#94a3b8";
                                  let prefixSymbol = "";
                                  
                                  if (isCorrectOption) {
                                    optionBg = "#14532d";
                                    optionBorder = "#22c55e";
                                    optionColor = "#34d399";
                                    prefixSymbol = "✓ ";
                                  } else if (isSelectedIncorrect) {
                                    optionBg = "#7f1d1d";
                                    optionBorder = "#ef4444";
                                    optionColor = "#f87171";
                                    prefixSymbol = "✗ ";
                                  }

                                    <div 
                                      key={optIdx}
                                      style={{ 
                                        background: optionBg,
                                        border: `2px solid ${optionBorder}`,
                                        color: optionColor,
                                        padding: "8px 12px",
                                        fontSize: "0.95rem",
                                        borderRadius: "2px",
                                        display: "flex",
                                        alignItems: "center"

                                    >
                                      <strong style={{ marginRight: "8px" }}>{prefixSymbol}{String.fromCharCode(65 + optIdx)}.</strong>

                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );

                      </div>

                const quiz = dayQuizzes[activeIndex];

                        {hasSubmitted && (

                      <p style={{ color: "#fff", fontWeight: "bold", fontSize: "1.15rem", marginBottom: "16px", lineHeight: "1.4" }}>

                      {isClosed && (
                        <div style={{ background: "#7f1d1d", border: "2px solid #ef4444", padding: "10px", color: "#fca5a5", fontSize: "1rem", textAlign: "center", fontWeight: "bold", marginBottom: "14px" }}>

                        </div>

                      <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                        {(quiz.options || [quiz.optA, quiz.optB, quiz.optC, quiz.optD].filter(Boolean)).map((opt, optIdx) => {

                          let optBorder = "#000";

                              optColor = "#34d399";

                              optColor = "#f87171";

                            }

                            </button>

                    </div>

function App() {
  const [currentHash, setCurrentHash] = useState(window.location.hash);
  const [showWelcomeModal, setShowWelcomeModal] = useState(false);
  const [user, setUser] = useState(null);

  useEffect(() => {
    const handleHash = () => setCurrentHash(window.location.hash);
    window.addEventListener("hashchange", handleHash);
    return () => window.removeEventListener("hashchange", handleHash);
  }, []);

  useEffect(() => {
    if (typeof firebase !== "undefined") {
      const unsubscribe = firebase.auth().onAuthStateChanged((u) => {
        if (u) {
          setUser(u);
        } else {
          setUser(null);
          const readonlyEmail = "readonly@quanta.com";
          const readonlyPass = "readonly_visitor";
          firebase.auth().signInWithEmailAndPassword(readonlyEmail, readonlyPass).catch((err) => {
            if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") {
              firebase.auth().createUserWithEmailAndPassword(readonlyEmail, readonlyPass).catch((regErr) => {
                console.error("Failed to auto-register guest account:", regErr);
              });
            } else {
              console.error("Failed to sign in as guest account:", err);
            }
          });
        }
      });
      return () => unsubscribe();
    }
  }, []);

  useEffect(() => {
    const hasVisited = localStorage.getItem("qssc3_visited");
    if (!hasVisited && !window.location.hash.startsWith("#portal")) {
      setShowWelcomeModal(true);
    }
  }, []);

  useEffect(() => {
    if (window.location.hash.startsWith("#admin")) {
      window.location.hash = "#portal";
    }
  }, [currentHash]);

  const handleRegisterClick = () => {
    setShowWelcomeModal(false);
    localStorage.setItem("qssc3_visited", "true");
    setTimeout(() => {
      const el = document.getElementById("register");
      if (el) {
        el.scrollIntoView({ behavior: "smooth" });
      }
    }, 100);
  };

  const isPortalMode = currentHash.startsWith("#portal");

  if (isPortalMode) {
    const isAdmin = user && user.email === "admin@quanta.com";
    return (
      <>
        {isAdmin ? (
          <>
            <nav style={{ justifyContent: "space-between" }}>
              <a href="#" style={{ display: "flex", alignItems: "center", gap: "12px", textDecoration: "none" }}>
                <div className="nav-brand-text">
                  QSSC³
                  <span>Admin Dashboard</span>
                </div>
              </a>
              <ul className="nav-links">
                <li><a href="#" onClick={() => window.location.hash = ""}>Portal Home</a></li>
              </ul>
            </nav>
            <AdminDashboard />
          </>
        ) : (
          <ParticipantPortal />
        )}
        <Footer />
      </>
    );
  }

  return (
    <>
      <Nav />
      <Hero />
      <div className="grass-separator" />
      <div className="dirt-separator" />
      <About />
      <Workshops />
      <Form />
      <Footer />
      
      {showWelcomeModal && (
        <div className="mc-modal-overlay">
          <div className="mc-modal-box" style={{ maxWidth: "480px" }}>
            <div className="achievement-popup-header" style={{ background: "#1b263b", borderColor: "#000" }}>
              <span className="achievement-popup-icon" style={{ fontSize: "28px" }}>📜</span>
              <div className="achievement-popup-texts">
                <div className="achievement-popup-title" style={{ color: "var(--mc-yellow)" }}>REGISTRY OPEN</div>
                <div className="achievement-popup-subtitle" style={{ fontSize: "9.5px" }}>QSSC³ Summer Camp 2026</div>
              </div>
            </div>
            <p style={{ marginTop: "24px", fontSize: "1.25rem", color: "#cbd5e1", lineHeight: "1.6" }}>
              Registrations for the 3rd edition of Quanta Science Summer Camp are now live! Secure your slot to unlock labs, group projects, and electronics workshops.
            </p>
            <button 
              className="mc-button" 
              onClick={handleRegisterClick} 
              style={{ width: "100%", padding: "16px", fontSize: "11px", fontFamily: "'Press Start 2P', monospace", background: "#4caf50", textShadow: "2px 2px 0 #1b5e20", boxWidth: "100%", boxShadow: "inset -4px -4px 0 #2e7d32, inset 4px 4px 0 #81c784, 4px 4px 0 #000" }}
            >
              👉 REGISTER NOW
            </button>
            <div style={{ marginTop: "14px" }}>
              <a 
                href="#" 
                onClick={(e) => { e.preventDefault(); setShowWelcomeModal(false); localStorage.setItem("qssc3_visited", "true"); }}
                style={{ color: "#8b8b8b", fontSize: "1.1rem", textDecoration: "underline", cursor: "pointer" }}
              >
                Close & Browse Site
              </a>
            </div>
          </div>
        </div>
      )}
    </>
  );
}
